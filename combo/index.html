        /* ==========================================================================
           HÀM RENDER RA GIAO DIỆN (TỰ ĐỘNG CHÈN DẤU '+' CHO 2 HOẶC 3 ITEMS)
           ========================================================================== */
        function renderComboPage() {
            const container = document.getElementById("combo-page-container");
            if (!container) return;

            container.innerHTML = Object.values(comboPageData)
                .map(
                    (section) => `
      <section class="combo-section" id="${section.sectionId}">
        <h2 class="combo-section__title">${section.sectionTitle}</h2>

        <div class="combo-section__list">
          ${section.combos
                            .map(
                                (combo) => `
            <article class="combo-card">
              
              <!-- Header: Tiêu đề & Subtitle -->
              <div class="combo-card__header">
                <h3 class="combo-card__title">${combo.title}</h3>
                ${combo.subtitle ? `<div class="combo-card__subtitle">${combo.subtitle}</div>` : ""}
              </div>

              <!-- Danh sách sản phẩm / dịch vụ ghép nối -->
              <div class="combo-card__items combo-card__items--count-${combo.items.length}">
                ${combo.items
                                        .map(
                                            (item, index) => `
                    ${index > 0 ? `<div class="combo-card__plus-badge" aria-hidden="true">+</div>` : ""}
                    
                    <div class="combo-card__item">
                      <img src="${item.image}" alt="${item.name}" class="combo-card__item-img" loading="lazy">
                      <div class="combo-card__item-overlay">
                        <span class="combo-card__item-name">${item.name}</span>
                        ${item.value ? `<span class="combo-card__item-value">${item.value}</span>` : ""}
                      </div>
                    </div>
                  `
                                        )
                                        .join("")}
              </div>

              <!-- Footer: Giá Ưu Đãi, Giá Gốc & Giỏ Hàng -->
              <div class="combo-card__footer">
                <div class="combo-card__price-box">
                  <span class="combo-card__deal-price">Giá Ưu Đãi: ${combo.dealPrice}</span>
                  <span class="combo-card__original-price">${combo.originalPrice}</span>
                </div>

                <button class="combo-card__cart-btn" type="button" aria-label="Thêm ${combo.title} vào giỏ hàng">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                  </svg>
                </button>
              </div>

            </article>
          `
                            )
                            .join("")}
        </div>
      </section>
    `
                )
                .join("");
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderComboPage();
