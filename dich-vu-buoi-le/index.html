        /* ==========================================================================
           RENDER ENGINE & TAB SWITCHING LOGIC
           ========================================================================== */
        function initSingleServices() {
            const tabsContainer = document.getElementById("single-services-tabs");
            const contentContainer = document.getElementById("single-services-content");

            if (!tabsContainer || !contentContainer) return;

            const tabKeys = Object.keys(singleServicesData);
            const hashTab = window.location.hash.slice(1);
            let activeTabKey = singleServicesData[hashTab] ? hashTab : "laser"; // Mặc định mở Tab LASER

            const renderTabContent = (tabKey) => {
                const currentData = singleServicesData[tabKey];
                if (!currentData || !currentData.sections.length) return;

                contentContainer.innerHTML = currentData.sections
                    .map((section) => {
                        const isWideLayout = section.layout === "wide";

                        return `
        <div class="single-services__section-group">
          ${section.sectionTitle ? `<h3 class="single-services__category">${section.sectionTitle}</h3>` : ""}
          
          <div class="${isWideLayout ? "single-services__wide-wrapper" : "single-services__grid"}">
            ${section.items
                                .map(
                                    (item) => `
              <article class="single-services__card ${isWideLayout ? "single-services__card--horizontal" : ""}">
                <div class="single-services__card-media">
                  <img src="${item.image}" alt="${item.title}" class="single-services__card-img" loading="lazy">
                  ${item.isCompare
                                            ? `
                    <span class="single-services__badge single-services__badge--before">Before</span>
                    <span class="single-services__badge single-services__badge--after">After</span>
                  `
                                            : ""
                                        }
                </div>
                
                <div class="single-services__card-body">
                  <h4 class="single-services__card-title">${item.title}</h4>
                  
                  <div class="single-services__section-title">TÁC DỤNG</div>
                  <ul class="single-services__benefits">
                    ${item.benefits.map((b) => `<li class="single-services__benefit-item">${b}</li>`).join("")}
                  </ul>
                  
                  <div class="single-services__section-title">CHỈ ĐỊNH</div>
                  <p class="single-services__indications">${item.indications}</p>
                  
                  <div class="single-services__card-footer">
                    <span class="single-services__price">Giá: ${item.price}</span>
                    <button class="single-services__cart-btn" type="button" aria-label="Thêm ${item.title} vào giỏ hàng">
                      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                      </svg>
                    </button>
                  </div>
                </div>
              </article>
            `
                                )
                                .join("")}
          </div>
        </div>
      `;
                    })
                    .join("");
            };

            // Render Danh Sách Nút Tabs
            tabsContainer.innerHTML = tabKeys
                .map(
                    (key) => `
      <button 
        type="button" 
        class="single-services__tab-btn ${key === activeTabKey ? "single-services__tab-btn--active" : ""}" 
        data-tab="${key}"
        role="tab"
        aria-selected="${key === activeTabKey}"
      >
        ${singleServicesData[key].tabName}
      </button>
    `
                )
                .join("");

            // Bắt Sự Kiện Chuyển Tab
            tabsContainer.querySelectorAll(".single-services__tab-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const selected = btn.getAttribute("data-tab");
                    if (selected === activeTabKey) return;

                    activeTabKey = selected;
                    tabsContainer.querySelectorAll(".single-services__tab-btn").forEach((b) => {
                        const isActive = b.getAttribute("data-tab") === activeTabKey;
                        b.classList.toggle("single-services__tab-btn--active", isActive);
                        b.setAttribute("aria-selected", String(isActive));
                    });

                    renderTabContent(activeTabKey);
                });
            });

            // Khởi chạy render lần đầu
            renderTabContent(activeTabKey);

            // Nếu người dùng vào bằng hash của một tab, cuộn tới vùng danh sách dịch vụ
            if (hashTab && singleServicesData[hashTab]) {
                document.getElementById("single-services").scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }
    </script>
</body>

</html>
