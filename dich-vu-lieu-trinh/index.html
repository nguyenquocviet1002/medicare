<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/sass/style.min.css?v=2">
    <link rel="stylesheet" href="sass/style.min.css?v=2">
</head>

<body>
    <section class="banner">
        <img src="images/banner.jpg" alt="">
    </section>

    <section class="package-services" id="package-services" aria-label="Dịch Vụ Liệu Trình">
        <div class="container">

            <!-- Tiêu Đề Chính -->
            <h2 class="package-services__title">DỊCH VỤ LIỆU TRÌNH</h2>

            <!-- Thanh Điều Hướng Tabs -->
            <div class="package-services__tabs-wrapper">
                <div class="package-services__tabs" id="package-services-tabs" role="tablist"></div>
            </div>

            <!-- Khung Chứa Thẻ Liệu Trình (Render Động Qua JS) -->
            <div class="package-services__content" id="package-services-content"></div>

        </div>
    </section>

    <script>
        /* ==========================================================================
   MODULE: DỊCH VỤ LIỆU TRÌNH (TREATMENT PACKAGES DATA & RENDER)
   ========================================================================== */

        const packageServicesData = {
            /* ==========================================================================
               TAB 1: ĐIỀU TRỊ MỤN (2 GÓI LIỆU TRÌNH)
               ========================================================================== */
            "dieu-tri-mun": {
                id: "dieu-tri-mun",
                tabName: "ĐIỀU TRỊ MỤN",
                items: [
                    {
                        id: "mun-co-ban",
                        title: "LIỆU TRÌNH ĐIỀU TRỊ MỤN CƠ BẢN",
                        beforeImg: "images/packages/mun-co-ban-before.jpg",
                        afterImg: "images/packages/mun-co-ban-after.jpg",
                        inclusions: [
                            "+ 3 BUỔI PEEL",
                            "+ 2 BUỔI LASER/ MESO",
                            "TẶNG 3 THÁNG CHĂM SÓC DA MIỄN PHÍ"
                        ],
                        benefits: [
                            "Đào thải bã nhờn, dứt điểm mụn ẩn & mụn viêm nhẹ",
                            "Làm dịu da, mờ thâm mới và hạn chế tổn thương sau mụn",
                            "Giúp bề mặt da thông thoáng, mịn màng và sáng khỏe"
                        ],
                        price: "10.000.000 VNĐ"
                    },
                    {
                        id: "mun-chuyen-sau",
                        title: "LIỆU TRÌNH ĐIỀU TRỊ MỤN CHUYÊN SÂU",
                        beforeImg: "images/packages/mun-chuyen-sau-before.jpg",
                        afterImg: "images/packages/mun-chuyen-sau-after.jpg",
                        inclusions: [
                            "4 BUỔI PEEL",
                            "4 BUỔI LASER/ MESO",
                            "4 BUỔI LASER PT",
                            "TẶNG 6 THÁNG CHĂM SÓC DA MIỄN PHÍ"
                        ],
                        benefits: [
                            "Dứt điểm mụn viêm dai dẳng, mụn tái phát nhiều lần",
                            "Làm dịu kích ứng, mờ thâm và ngăn ngừa hình thành sẹo rỗ",
                            "Phục hồi hàng rào bảo vệ, giúp nền da khỏe mịn toàn diện"
                        ],
                        price: "20.000.000 VNĐ"
                    }
                ]
            },

            /* ==========================================================================
               TAB 2: ĐIỀU TRỊ SẸO (3 GÓI LIỆU TRÌNH)
               ========================================================================== */
            "dieu-tri-seo": {
                id: "dieu-tri-seo",
                tabName: "ĐIỀU TRỊ SẸO",
                items: [
                    {
                        id: "seo-co-ban",
                        title: "LIỆU TRÌNH ĐIỀU TRỊ SẸO CƠ BẢN",
                        beforeImg: "images/packages/seo-co-ban-before.jpg",
                        afterImg: "images/packages/seo-co-ban-after.jpg",
                        inclusions: [
                            "6 BUỔI ĐIỀU TRỊ SẸO 5IN1",
                            "TẶNG 6 THÁNG CHĂM SÓC DA MIỄN PHÍ"
                        ],
                        benefits: [
                            "Làm đầy 50–70% sẹo rỗ nông, se khít lỗ chân lông, cải thiện bề mặt da"
                        ],
                        price: "29.000.000 VNĐ"
                    },
                    {
                        id: "seo-chuyen-sau",
                        title: "LIỆU TRÌNH ĐIỀU TRỊ SẸO CHUYÊN SÂU",
                        beforeImg: "images/packages/seo-chuyen-sau-before.jpg",
                        afterImg: "images/packages/seo-chuyen-sau-after.jpg",
                        inclusions: [
                            "6 BUỔI SẸO 5IN1",
                            "3 BUỔI MESO",
                            "2 BUỔI LASER 2IN1",
                            "TẶNG 12 THÁNG CHĂM SÓC DA MIỄN PHÍ"
                        ],
                        benefits: [
                            "Đầy 70–85% sẹo rỗ lâu năm, phục hồi nền da dày khỏe, thu nhỏ lỗ chân lông rõ rệt"
                        ],
                        price: "39.000.000 VNĐ"
                    },
                    {
                        id: "seo-da-tang",
                        title: "LIỆU TRÌNH ĐIỀU TRỊ SẸO ĐA TẦNG",
                        beforeImg: "images/packages/seo-da-tang-before.jpg",
                        afterImg: "images/packages/seo-da-tang-after.jpg",
                        inclusions: [
                            "6 BUỔI SẸO 5IN1",
                            "6 BUỔI MESO",
                            "6 BUỔI LASER 3IN1",
                            "CHĂM SÓC DA MIỄN PHÍ TRỌN ĐỜI"
                        ],
                        benefits: [
                            "Đầy 85–95% sẹo rỗ phức tạp, sẹo xơ cứng lâu năm; tái sinh nền da căng bóng, săn chắc toàn diện"
                        ],
                        price: "80.000.000 VNĐ"
                    }
                ]
            },

            /* ==========================================================================
               TAB 3: LIỆU TRÌNH BODY (3 GÓI LIỆU TRÌNH)
               ========================================================================== */
            "lieu-trinh-body": {
                id: "lieu-trinh-body",
                tabName: "LIỆU TRÌNH BODY",
                items: [
                    {
                        id: "body-vung-nho",
                        title: "VÙNG NHỎ (NÁCH / 1 TAY / 1 CHÂN)",
                        beforeImg: "images/packages/body-vung-nho-before.jpg",
                        afterImg: "images/packages/body-vung-nho-after.jpg",
                        inclusions: [
                            "3 BUỔI LASER TONING",
                            "3 BUỔI CHEMICAL PEEL"
                        ],
                        benefits: [
                            "Mờ thâm sạm rõ rệt, se khít lỗ chân lông, giảm tình trạng sần da gà do cạo/nhổ"
                        ],
                        price: "10.000.000 VNĐ"
                    },
                    {
                        id: "body-vung-trung-binh",
                        title: "VÙNG TRUNG BÌNH (NGỰC/MÔNG)",
                        beforeImg: "images/packages/body-vung-tb-before.jpg",
                        afterImg: "images/packages/body-vung-tb-after.jpg",
                        inclusions: [
                            "3 BUỔI LASER TONING/ FRACTIONAL",
                            "3 BUỔI CHEMICAL PEEL"
                        ],
                        benefits: [
                            "Trị dứt điểm mụn lưng, mờ thâm mụn body, cải thiện viêm nang lông, trả lại làn da mịn màng, sáng khỏe"
                        ],
                        price: "15.000.000 VNĐ"
                    },
                    {
                        id: "body-vung-lon",
                        title: "VÙNG LỚN (LƯNG / 2 TAY / 2 CHÂN)",
                        beforeImg: "images/packages/body-vung-lon-before.jpg",
                        afterImg: "images/packages/body-vung-lon-after.jpg",
                        inclusions: [
                            "3 BUỔI LASER TONING/ FRACTIONAL",
                            "3 BUỔI CHEMICAL PEEL"
                        ],
                        benefits: [
                            "Trị dứt điểm mụn lưng, mờ thâm mụn body, cải thiện viêm nang lông, trả lại làn da mịn màng, sáng khỏe"
                        ],
                        price: "22.000.000 VNĐ"
                    }
                ]
            }
        };

        // 2. Hàm Render & Xử Lý Tab
        function initPackageServices() {
            const tabsContainer = document.getElementById("package-services-tabs");
            const contentContainer = document.getElementById("package-services-content");

            if (!tabsContainer || !contentContainer) return;

            const tabKeys = Object.keys(packageServicesData);
            const hashTab = window.location.hash.slice(1);
            let activeTabKey = packageServicesData[hashTab] ? hashTab : "dieu-tri-mun"; // Mặc định mở Tab Điều Trị Mụn

            const renderContent = (tabKey) => {
                const currentData = packageServicesData[tabKey];
                if (!currentData || !currentData.items.length) return;

                contentContainer.innerHTML = currentData.items
                    .map(
                        (item) => `
        <article class="package-services__card">
          
          <!-- Cột Trái: Ảnh Before & After -->
          <div class="package-services__media">
            <div class="package-services__media-item">
              <img src="${item.beforeImg}" alt="Tình trạng trước điều trị" class="package-services__media-img" loading="lazy">
              <span class="package-services__media-badge">Before</span>
            </div>
            <div class="package-services__media-item">
              <img src="${item.afterImg}" alt="Kết quả sau liệu trình" class="package-services__media-img" loading="lazy">
              <span class="package-services__media-badge">After</span>
            </div>
          </div>

          <!-- Cột Phải: Nội Dung Chi Tiết Gói -->
          <div class="package-services__body">
            <h3 class="package-services__card-title">${item.title}</h3>

            <!-- Điểm nổi bật gói -->
            <div class="package-services__inclusions">
              ${item.inclusions
                                .map(
                                    (inc) => `
                <div class="package-services__inclusion-item">
                  <span class="package-services__inclusion-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10"></circle>
                      <line x1="12" y1="8" x2="12" y2="16"></line>
                      <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                  </span>
                  <span>${inc}</span>
                </div>
              `
                                )
                                .join("")}
            </div>

            <!-- Tác dụng -->
            <ul class="package-services__benefits">
              ${item.benefits
                                .map(
                                    (benefit) => `
                <li class="package-services__benefit-item">${benefit}</li>
              `
                                )
                                .join("")}
            </ul>

            <!-- Footer: Giá & Icon Giỏ Hàng -->
            <div class="package-services__footer">
              <span class="package-services__price">Giá: ${item.price}</span>
              <button class="package-services__cart-btn" type="button" aria-label="Thêm ${item.title} vào giỏ hàng">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
              </button>
            </div>

          </div>

        </article>
      `
                    )
                    .join("");
            };

            // Render Danh Sách Nút Tabs
            tabsContainer.innerHTML = tabKeys
                .map(
                    (key) => `
      <button 
        type="button" 
        class="package-services__tab-btn ${key === activeTabKey ? "package-services__tab-btn--active" : ""}" 
        data-tab="${key}"
        role="tab"
        aria-selected="${key === activeTabKey}"
      >
        ${packageServicesData[key].tabName}
      </button>
    `
                )
                .join("");

            // Bắt Sự Kiện Chuyển Tab
            tabsContainer.querySelectorAll(".package-services__tab-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const selected = btn.getAttribute("data-tab");
                    if (selected === activeTabKey) return;

                    activeTabKey = selected;
                    tabsContainer.querySelectorAll(".package-services__tab-btn").forEach((b) => {
                        const isActive = b.getAttribute("data-tab") === activeTabKey;
                        b.classList.toggle("package-services__tab-btn--active", isActive);
                        b.setAttribute("aria-selected", String(isActive));
                    });

                    renderContent(activeTabKey);
                });
            });

            // Render Lần Đầu
            renderContent(activeTabKey);

            // Nếu người dùng vào bằng hash của một tab, cuộn tới vùng danh sách dịch vụ
            if (hashTab && packageServicesData[hashTab]) {
                document.getElementById("package-services").scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initPackageServices(); // <-- Kích hoạt màn hình Dịch Vụ Liệu Trình
        });
    </script>
</body>

</html>
