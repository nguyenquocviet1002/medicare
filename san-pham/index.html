                                indications: "Vết chân chim, nhăn trán, nhăn cau mày, cơ hàm bạnh, thon gọn bắp tay/bắp chân.",
                                price: "3.000.000 VNĐ"
                            },
                            {
                                id: "botox-xeomin",
                                title: "BOTOX XEOMIN",
                                image: "images/services/botox-xeomin.jpg",
                                benefits: [
                                    "Dòng Botox tinh khiết không chứa protein phức hợp, hạn chế nguy cơ kháng thuốc/lờn thuốc sau nhiều lần tiêm."
                                ],
                                indications: "Tiêm xóa nhăn định kỳ, thu gọn góc hàm cho khách hàng có cơ địa dễ kháng botox.",
                                price: "15.000.000 VNĐ"
                            }
                        ]
                    }
                ]
            }
        };

        /* ==========================================================================
           ENGINE RENDER TABS & ĐIỀU KHIỂN TỪNG SLIDER RIÊNG BIỆT
           ========================================================================== */
        function initTabbedSlider() {
            const tabsContainer = document.getElementById("tabbed-slider-tabs");
            const contentContainer = document.getElementById("tabbed-slider-content");

            if (!tabsContainer || !contentContainer) return;

            const tabKeys = Object.keys(tabbedSliderData);
            const hashTab = window.location.hash.slice(1);
            let activeTabKey = tabbedSliderData[hashTab] ? hashTab : "meso"; // Mặc định mở Tab MESO

            // Khởi tạo hoạt động cho các Slider trong Section
            const setupCarousels = () => {
                const wrappers = contentContainer.querySelectorAll(".tabbed-slider__carousel-wrapper");

                wrappers.forEach((wrapper) => {
                    const track = wrapper.querySelector(".tabbed-slider__track");
                    const prevBtn = wrapper.querySelector(".tabbed-slider__nav-btn--prev");
                    const nextBtn = wrapper.querySelector(".tabbed-slider__nav-btn--next");
                    const slides = Array.from(track.querySelectorAll(".tabbed-slider__slide"));

                    if (!track || !slides.length) return;

                    let currentIndex = 0;
                    let startX = 0;
                    let isDragging = false;

                    const updatePosition = (index) => {
                        const visibleCards = window.innerWidth <= 575 ? 1 : window.innerWidth <= 991 ? 2 : 3;
                        const maxIndex = Math.max(0, slides.length - visibleCards);
                        currentIndex = Math.max(0, Math.min(index, maxIndex));

                        const slideWidth = slides[0].offsetWidth;
                        const gap = 24; // 1.5rem = 24px
                        track.style.transform = `translateX(-${currentIndex * (slideWidth + gap)}px)`;
                    };

                    nextBtn?.addEventListener("click", () => updatePosition(currentIndex + 1));
                    prevBtn?.addEventListener("click", () => updatePosition(currentIndex - 1));

                    window.addEventListener("resize", () => updatePosition(currentIndex));

                    // Vuốt chạm cảm ứng
                    track.addEventListener("touchstart", (e) => {
                        startX = e.touches[0].clientX;
                        isDragging = true;
                    }, { passive: true });

                    track.addEventListener("touchend", (e) => {
                        if (!isDragging) return;
                        const diff = startX - e.changedTouches[0].clientX;
                        if (Math.abs(diff) > 40) {
                            if (diff > 0) updatePosition(currentIndex + 1);
                            else updatePosition(currentIndex - 1);
                        }
                        isDragging = false;
                    });
                });
            };

            // Render toàn bộ các Category và Slider của Tab được chọn
            const renderTabContent = (tabKey) => {
                const currentData = tabbedSliderData[tabKey];
                if (!currentData || !currentData.sections.length) return;

                contentContainer.innerHTML = currentData.sections
                    .map(
                        (section) => `
        <div class="tabbed-slider__section-block">
          <h3 class="tabbed-slider__category">${section.sectionTitle}</h3>
          
          <div class="tabbed-slider__carousel-wrapper">
            <!-- Nút Prev -->
            <button class="tabbed-slider__nav-btn tabbed-slider__nav-btn--prev" type="button" aria-label="Slide trước">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </button>

            <!-- Khung Viewport -->
            <div class="tabbed-slider__viewport">
              <div class="tabbed-slider__track">
                ${section.items
                                .map(
                                    (item) => `
                  <div class="tabbed-slider__slide">
                    <article class="tabbed-slider__card">
                      <div class="tabbed-slider__card-media">
                        <img src="${item.image}" alt="${item.title}" class="tabbed-slider__card-img" loading="lazy">
                      </div>
                      
                      <div class="tabbed-slider__card-body">
                        <h4 class="tabbed-slider__card-title">${item.title}</h4>
                        
                        <div class="tabbed-slider__section-title">TÁC DỤNG</div>
                        <ul class="tabbed-slider__benefits">
                          ${item.benefits.map((b) => `<li class="tabbed-slider__benefit-item">${b}</li>`).join("")}
                        </ul>
                        
                        <div class="tabbed-slider__section-title">CHỈ ĐỊNH</div>
                        <p class="tabbed-slider__indications">${item.indications}</p>
                        
                        <div class="tabbed-slider__card-footer">
                          <span class="tabbed-slider__price">Giá: ${item.price}</span>
                          <button class="tabbed-slider__cart-btn" type="button" aria-label="Thêm ${item.title} vào giỏ hàng">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                              <line x1="3" y1="6" x2="21" y2="6"></line>
                              <path d="M16 10a4 4 0 0 1-8 0"></path>
                            </svg>
                          </button>
                        </div>
                      </div>
                    </article>
                  </div>
                `
                                )
                                .join("")}
              </div>
            </div>

            <!-- Nút Next -->
            <button class="tabbed-slider__nav-btn tabbed-slider__nav-btn--next" type="button" aria-label="Slide tiếp theo">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
        </div>
      `
                    )
                    .join("");

                setupCarousels();
            };

            // Render các nút Tabs
            tabsContainer.innerHTML = tabKeys
                .map(
                    (key) => `
      <button 
        type="button" 
        class="tabbed-slider__tab-btn ${key === activeTabKey ? "tabbed-slider__tab-btn--active" : ""}" 
        data-tab="${key}"
        role="tab"
        aria-selected="${key === activeTabKey}"
      >
        ${tabbedSliderData[key].tabName}
      </button>
    `
                )
                .join("");

            // Bắt sự kiện chuyển Tab
            tabsContainer.querySelectorAll(".tabbed-slider__tab-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const selected = btn.getAttribute("data-tab");
                    if (selected === activeTabKey) return;

                    activeTabKey = selected;
                    tabsContainer.querySelectorAll(".tabbed-slider__tab-btn").forEach((b) => {
                        const isActive = b.getAttribute("data-tab") === activeTabKey;
                        b.classList.toggle("tabbed-slider__tab-btn--active", isActive);
                        b.setAttribute("aria-selected", String(isActive));
                    });

                    renderTabContent(activeTabKey);
                });
            });

            renderTabContent(activeTabKey);

            // Nếu người dùng vào bằng hash của một tab, cuộn tới vùng danh sách dịch vụ
            if (hashTab && tabbedSliderData[hashTab]) {
                document.getElementById("injectable-services").scrollIntoView({ behavior: "smooth", block: "start" });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initTabbedSlider();
        });
    </script>
</body>
